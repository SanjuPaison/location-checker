<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Location Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body {
    margin: 0; padding: 0;
    background: #0b0a13;
    font-family: 'Open Sans', system-ui, sans-serif;
  }
  #lc-root.lc-root {
    --lc-ink: #f1eefc;
    --lc-sub: #a49cc4;
    --lc-bg: #0f0d1a;
    --lc-card: #171326;
    --lc-accent: #b18cff;
    --lc-accent-2: #ff7ad9;
    --lc-line: #2b2542;
    --lc-chip: #1d1830;
    --lc-red: #ff5c6c;
    --lc-yellow: #ffcf5c;
    --lc-green: #3fe0a0;
    max-width: 420px;
    margin: 0 auto;
    background: radial-gradient(circle at 15% 0%, #201a3a 0%, #0f0d1a 55%), var(--lc-bg);
    color: var(--lc-ink);
    font-weight: 300;
    letter-spacing: 1.5px;
    font-size: 12.5px;
    line-height: 1.45;
    padding: 14px 14px 18px;
  }
  #lc-root.lc-root * { box-sizing: border-box; }

  .lc-header { text-align: center; margin-bottom: 10px; }
  .lc-title {
    font-size: 18px; font-weight: 700; letter-spacing: 0.5px; margin: 0 0 2px;
    background: linear-gradient(90deg, var(--lc-accent), var(--lc-accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .lc-sub { font-size: 10.5px; color: var(--lc-sub); margin: 0; letter-spacing: 0.5px; }

  .lc-card {
    border: 1px solid var(--lc-line);
    border-radius: 14px;
    padding: 10px 12px 12px;
    margin-bottom: 8px;
    background: var(--lc-card);
  }
  .lc-card-label {
    font-size: 9.5px; text-transform: uppercase; letter-spacing: 1.8px;
    color: var(--lc-sub); font-weight: 700; margin: 0 0 8px;
  }
  .lc-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .lc-row:last-child { margin-bottom: 0; }
  .lc-field { flex: 1; min-width: 0; }
  .lc-field label {
    display: block; font-size: 9px; color: var(--lc-sub);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px;
  }
  #lc-root input[type="date"], #lc-root input[type="time"], #lc-root input[type="text"],
  #lc-root select {
    width: 100%; font-family: inherit; font-size: 12.5px; letter-spacing: 0.5px;
    padding: 6px 7px; border: 1px solid var(--lc-line); border-radius: 8px;
    background: #0f0d1a; color: var(--lc-ink);
    color-scheme: dark;
  }
  #lc-root input:focus, #lc-root select:focus { outline: 2px solid var(--lc-accent); outline-offset: 1px; }
  .lc-required-note { font-size: 9px; color: var(--lc-sub); margin-top: 5px; letter-spacing: 0.3px; }

  .lc-geo-row { display: flex; gap: 6px; }
  .lc-geo-row input { flex: 1; }
  button.lc-mini-btn {
    flex: 0 0 auto; border: 1px solid var(--lc-accent); color: var(--lc-accent);
    background: transparent; border-radius: 8px; padding: 0 10px; font-size: 10.5px;
    font-family: inherit; letter-spacing: 1px; cursor: pointer; white-space: nowrap;
  }
  button.lc-mini-btn:active { background: var(--lc-chip); }
  .lc-geo-status { font-size: 9.5px; margin-top: 4px; min-height: 1.1em; letter-spacing: 0.3px; color: var(--lc-sub); }
  .lc-geo-status.lc-ok { color: var(--lc-green); }
  .lc-geo-status.lc-err { color: var(--lc-red); }

  .lc-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  button.lc-chip {
    font-family: inherit; font-size: 10px; letter-spacing: 0.8px;
    padding: 5px 9px; border-radius: 999px; border: 1px solid var(--lc-line);
    background: var(--lc-chip); color: var(--lc-ink); cursor: pointer;
  }
  button.lc-chip.lc-chip-active { background: linear-gradient(90deg, var(--lc-accent), var(--lc-accent-2)); border-color: transparent; color: #16101f; }
  button.lc-chip:active { transform: scale(0.97); }

  button.lc-here-btn {
    width: 100%; margin-top: 6px; font-family: inherit; font-size: 10.5px;
    letter-spacing: 1px; padding: 7px; border-radius: 8px; border: 1px dashed var(--lc-accent-2);
    background: rgba(255,122,217,0.07); color: var(--lc-accent-2); cursor: pointer;
  }

  .lc-error {
    margin-top: 8px; padding: 7px 9px; border-radius: 8px; font-size: 10.5px;
    background: rgba(255,92,108,0.1); color: #ffb3ba; border: 1px solid rgba(255,92,108,0.35); letter-spacing: 0.4px;
  }

  /* Results — sits right under the header, always visible */
  .lc-meter-card {
    text-align: center; border-radius: 16px; padding: 14px 10px 10px; margin-bottom: 8px;
    background: var(--lc-card); border: 1px solid var(--lc-line);
  }
  .lc-meter-loc { font-size: 10.5px; color: var(--lc-sub); margin: 0 0 6px; letter-spacing: 0.5px; }
  .lc-gauge { position: relative; width: 128px; height: 72px; margin: 0 auto; }
  .lc-gauge svg { width: 100%; height: 100%; display: block; }
  .lc-gauge-pct {
    position: absolute; bottom: 0; left: 0; right: 0; text-align: center;
    font-size: 24px; font-weight: 700; letter-spacing: 0.5px;
  }
  .lc-gauge-word {
    font-size: 10px; text-transform: uppercase; letter-spacing: 2px; font-weight: 700;
    margin-top: 4px;
  }

  details.lc-acc {
    border-top: 1px solid var(--lc-line); text-align: left; margin-top: 8px; padding-top: 8px;
  }
  details.lc-acc summary {
    cursor: pointer; list-style: none; font-size: 10px; text-transform: uppercase;
    letter-spacing: 1.8px; font-weight: 700; color: var(--lc-accent);
    display: flex; align-items: center; justify-content: space-between;
  }
  details.lc-acc summary::-webkit-details-marker { display: none; }
  details.lc-acc summary::after { content: '+'; font-size: 13px; color: var(--lc-sub); }
  details.lc-acc[open] summary::after { content: '\2212'; }
  details.lc-acc .lc-acc-body { padding-top: 6px; }
  details.lc-acc p { margin: 0 0 6px; font-size: 11px; letter-spacing: 0.4px; color: var(--lc-ink); }
  details.lc-acc p:last-child { margin-bottom: 0; }
  .lc-sign-name { font-weight: 700; color: var(--lc-accent-2); }
  .lc-none { color: var(--lc-sub); font-style: italic; }

  .lc-legal {
    margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--lc-line);
    text-align: center; font-size: 9px; color: var(--lc-sub); letter-spacing: 0.6px;
  }
  .lc-legal a { color: var(--lc-accent); text-decoration: none; }
  .lc-legal a:hover { text-decoration: underline; }
  .lc-legal .lc-sep { margin: 0 5px; color: var(--lc-line); }

  @media (max-width: 380px) {
    #lc-root.lc-root { font-size: 12px; padding: 10px 10px 14px; }
    .lc-title { font-size: 16.5px; }
  }
</style>
</head>
<body>

<div id="lc-root" class="lc-root">

  <div class="lc-header">
    <h1 class="lc-title">Location Checker</h1>
    <p class="lc-sub">Birth details + a place. See how it reads.</p>
  </div>

  <div class="lc-results" id="lc-results"></div>

  <form id="lc-form">
    <div class="lc-card">
      <p class="lc-card-label">Birth info</p>
      <div class="lc-row">
        <div class="lc-field">
          <label for="lc-bdate">Date</label>
          <input type="date" id="lc-bdate" required min="1900-01-01" max="2060-12-31">
        </div>
        <div class="lc-field">
          <label for="lc-btime">Time</label>
          <input type="time" id="lc-btime" required>
        </div>
      </div>
      <div class="lc-row">
        <div class="lc-field">
          <label for="lc-utc">UTC offset at birth</label>
          <select id="lc-utc"></select>
        </div>
      </div>
      <p class="lc-required-note">Exact birth time is required — this can't be computed without it.</p>
    </div>

    <div class="lc-card">
      <p class="lc-card-label">Current location</p>
      <div class="lc-geo-row">
        <input type="text" id="lc-place" placeholder="Type a city..." autocomplete="off">
        <button type="button" class="lc-mini-btn" id="lc-geo-btn">Locate</button>
      </div>
      <div class="lc-geo-status" id="lc-geo-status"></div>
      <button type="button" class="lc-here-btn" id="lc-here-btn">Use my current location</button>
      <div class="lc-chips" id="lc-city-chips"></div>
    </div>

    <div class="lc-error" id="lc-error" style="display:none;"></div>
  </form>

  <div class="lc-legal">
    <a href="disclaimer.html" target="_blank" rel="noopener">Disclaimer</a>
    <span class="lc-sep">&middot;</span>
    <a href="privacy.html" target="_blank" rel="noopener">Privacy</a>
    <span class="lc-sep">&middot;</span>
    <a href="https://lifeprediction.net" target="_blank" rel="noopener">lifeprediction.net</a>
  </div>

</div>

<script src="astro-engine.js"></script>
<script>
(function () {
  "use strict";

  var CITIES = [
    { name: "Bangkok", lat: 13.7563, lon: 100.5018 },
    { name: "Hong Kong", lat: 22.3193, lon: 114.1694 },
    { name: "London", lat: 51.5074, lon: -0.1278 },
    { name: "Sydney", lat: -33.8688, lon: 151.2093 },
    { name: "Istanbul", lat: 41.0082, lon: 28.9784 },
    { name: "Dubai", lat: 25.2048, lon: 55.2708 },
    { name: "Delhi", lat: 28.7041, lon: 77.1025 },
    { name: "New York", lat: 40.7128, lon: -74.0060 },
    { name: "Paris", lat: 48.8566, lon: 2.3522 },
    { name: "Los Angeles", lat: 34.0522, lon: -118.2437 },
    { name: "Cairo", lat: 30.0444, lon: 31.2357 },
    { name: "Hanoi", lat: 21.0278, lon: 105.8342 },
    { name: "Vancouver", lat: 49.2827, lon: -123.1207 },
    { name: "S\u00e3o Paulo", lat: -23.5505, lon: -46.6333 }
  ];

  var form = document.getElementById("lc-form");
  var resultsEl = document.getElementById("lc-results");
  var errorEl = document.getElementById("lc-error");
  var utcSelect = document.getElementById("lc-utc");
  var dateInput = document.getElementById("lc-bdate");
  var timeInput = document.getElementById("lc-btime");
  var placeInput = document.getElementById("lc-place");
  var geoBtn = document.getElementById("lc-geo-btn");
  var geoStatus = document.getElementById("lc-geo-status");
  var hereBtn = document.getElementById("lc-here-btn");
  var chipsEl = document.getElementById("lc-city-chips");

  var currentLat = null, currentLon = null, currentLabel = null, activeChip = null;

  // ---- defaults: today's date/time and an approximate local position ----
  // These are just starting points so a reading is visible immediately —
  // they don't need to be precise, the person can change any of them.
  var now = new Date();
  dateInput.value = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate());
  timeInput.value = pad(now.getHours()) + ":" + pad(now.getMinutes());
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  // UTC offset options, default to the browser's own local offset
  var OFFSETS = [-12,-11,-10,-9.5,-9,-8,-7,-6,-5,-4.5,-4,-3.5,-3,-2,-1,0,1,2,3,3.5,4,4.5,5,5.5,5.75,6,6.5,7,8,8.75,9,9.5,10,10.5,11,12,12.75,13,14];
  var localOffset = -now.getTimezoneOffset() / 60;
  var closestOffset = OFFSETS.reduce(function (a, b) {
    return Math.abs(b - localOffset) < Math.abs(a - localOffset) ? b : a;
  });
  OFFSETS.forEach(function (o) {
    var opt = document.createElement("option");
    opt.value = o;
    opt.textContent = "UTC" + (o >= 0 ? "+" : "") + o;
    if (o === closestOffset) opt.selected = true;
    utcSelect.appendChild(opt);
  });

  // City chips
  CITIES.forEach(function (c) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "lc-chip";
    btn.textContent = c.name;
    btn.addEventListener("click", function () {
      currentLat = c.lat; currentLon = c.lon; currentLabel = c.name;
      placeInput.value = c.name;
      geoStatus.textContent = "";
      if (activeChip) activeChip.classList.remove("lc-chip-active");
      btn.classList.add("lc-chip-active");
      activeChip = btn;
      tryCompute();
    });
    chipsEl.appendChild(btn);
  });

  function clearChipSelection() {
    if (activeChip) { activeChip.classList.remove("lc-chip-active"); activeChip = null; }
  }

  placeInput.addEventListener("input", clearChipSelection);

  geoBtn.addEventListener("click", function () {
    var place = placeInput.value.trim();
    if (!place) { geoStatus.textContent = "Type a place first."; geoStatus.className = "lc-geo-status lc-err"; return; }
    geoStatus.textContent = "Searching...";
    geoStatus.className = "lc-geo-status";
    var url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(place);
    fetch(url, { headers: { "Accept": "application/json" } })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res || res.length === 0) throw new Error("Could not find that place.");
        currentLat = parseFloat(res[0].lat);
        currentLon = parseFloat(res[0].lon);
        currentLabel = res[0].display_name;
        clearChipSelection();
        geoStatus.textContent = "Found: " + res[0].display_name.split(",").slice(0,2).join(",");
        geoStatus.className = "lc-geo-status lc-ok";
        tryCompute();
      })
      .catch(function (err) {
        geoStatus.textContent = err.message || "Could not find that place.";
        geoStatus.className = "lc-geo-status lc-err";
      });
  });

  function useGeolocation(silent) {
    if (!navigator.geolocation) {
      if (!silent) { geoStatus.textContent = "Geolocation isn't available in this browser."; geoStatus.className = "lc-geo-status lc-err"; }
      return;
    }
    if (!silent) { geoStatus.textContent = "Finding your location..."; geoStatus.className = "lc-geo-status"; }
    navigator.geolocation.getCurrentPosition(function (pos) {
      currentLat = pos.coords.latitude;
      currentLon = pos.coords.longitude;
      currentLabel = "Your current location";
      placeInput.value = "";
      clearChipSelection();
      if (!silent) {
        geoStatus.textContent = "Using your current location (" + currentLat.toFixed(2) + ", " + currentLon.toFixed(2) + ")";
        geoStatus.className = "lc-geo-status lc-ok";
      }
      tryCompute();
    }, function () {
      if (!silent) { geoStatus.textContent = "Couldn't get your location. Check permissions."; geoStatus.className = "lc-geo-status lc-err"; }
      else if (currentLat === null) {
        // silent fallback so a reading is visible even without permission
        currentLat = 0; currentLon = 0; currentLabel = "Default location — set yours below";
        tryCompute();
      }
    }, { timeout: 6000 });
  }
  hereBtn.addEventListener("click", function () { useGeolocation(false); });

  [dateInput, timeInput, utcSelect].forEach(function (el) {
    el.addEventListener("change", tryCompute);
  });

  function showError(msg) { errorEl.textContent = msg; errorEl.style.display = "block"; }
  function clearError() { errorEl.style.display = "none"; errorEl.textContent = ""; }

  function gaugeSvg(pct, color) {
    var cx = 64, cy = 64, r = 54;
    var angle = Math.PI - (pct / 100) * Math.PI;
    var x = cx + r * Math.cos(angle);
    var y = cy - r * Math.sin(angle);
    var largeArc = pct > 50 ? 1 : 0;
    var bgPath = 'M ' + (cx - r) + ' ' + cy + ' A ' + r + ' ' + r + ' 0 1 1 ' + (cx + r) + ' ' + cy;
    var fgPath = 'M ' + (cx - r) + ' ' + cy + ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 ' + x + ' ' + y;
    return '<svg viewBox="0 0 128 72">' +
      '<path d="' + bgPath + '" fill="none" stroke="#2b2542" stroke-width="12" stroke-linecap="round"/>' +
      '<path d="' + fgPath + '" fill="none" stroke="' + color + '" stroke-width="12" stroke-linecap="round"/>' +
      '</svg>';
  }

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function escapeHtml(s) {
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function renderResults(r) {
    var colorHex = r.pct <= 30 ? "#ff5c6c" : (r.pct >= 70 ? "#3fe0a0" : "#ffcf5c");
    var word = r.pct <= 30 ? "Lower safety read" : (r.pct >= 70 ? "Higher safety read" : "Mixed safety read");

    var html = "";
    html += '<div class="lc-meter-card">';
    html += '<p class="lc-meter-loc">' + escapeHtml(r.locationLabel) + '</p>';
    html += '<div class="lc-gauge">' + gaugeSvg(r.pct, colorHex) + '<div class="lc-gauge-pct" style="color:' + colorHex + '">' + r.pct + '%</div></div>';
    html += '<div class="lc-gauge-word" style="color:' + colorHex + '">' + word + '</div>';

    html += '<details class="lc-acc"><summary>Sign</summary><div class="lc-acc-body">';
    html += '<p><span class="lc-sign-name">' + r.sign + '</span> &middot; ' + r.degInSign.toFixed(1) + '&deg; &mdash; ' + SIGN_TEXT[r.sign] + '</p>';
    html += '</div></details>';

    html += '<details class="lc-acc"><summary>Natal planet aspects</summary><div class="lc-acc-body">';
    if (r.planetAspects.length === 0) {
      html += '<p class="lc-none">No natal planets closely aspect this point here.</p>';
    } else {
      r.planetAspects.forEach(function (a) {
        html += '<p>' + cap(a.planet) + ' ' + ASPECT_TONE[a.aspect] + ' this point &mdash; ' + PLANET_INFO[a.planet] + '.</p>';
      });
    }
    html += '</div></details>';

    html += '<details class="lc-acc"><summary>Midpoint hits</summary><div class="lc-acc-body">';
    if (r.midpointHits.length === 0) {
      html += '<p class="lc-none">No natal midpoints land here.</p>';
    } else {
      r.midpointHits.forEach(function (m) {
        html += '<p>This point sits on your ' + cap(m.a) + '/' + cap(m.b) + ' midpoint &mdash; ' + PLANET_INFO[m.a] + ' meets ' + PLANET_INFO[m.b] + '.</p>';
      });
    }
    html += '</div></details>';

    html += '</div>';
    resultsEl.innerHTML = html;
  }

  function tryCompute() {
    clearError();
    if (!dateInput.value || !timeInput.value) return;
    if (currentLat === null || currentLon === null) return;

    var bParts = dateInput.value.split("-").map(Number);
    var tParts = timeInput.value.split(":").map(Number);
    var utcOffset = parseFloat(utcSelect.value);

    try {
      var utHour = tParts[0] + tParts[1] / 60 - utcOffset;
      var jd = LCAstro.julianDay(bParts[0], bParts[1], bParts[2], utHour);
      var result = LCAstro.computeReading(jd, currentLat, currentLon);
      result.locationLabel = currentLabel || (currentLat.toFixed(2) + ", " + currentLon.toFixed(2));
      renderResults(result);
    } catch (err) {
      showError(err.message || "Something went wrong computing this reading.");
    }
  }

  form.addEventListener("submit", function (e) { e.preventDefault(); tryCompute(); });

  // ---- content tables ----
  var SIGN_TEXT = {
    "Aries": "Instincts run fast and protective here, which cuts both ways: you'll sense trouble quickly, but the same speed can push you into unfamiliar streets before you've really weighed it. Trust the gut call, just don't sprint past it.",
    "Taurus": "A grounded, comfort-seeking read. You gravitate to established, well-worn areas and steady routines, which is generally a safe pattern &mdash; the risk is moving slowly to notice a place has changed.",
    "Gemini": "Sharp and adaptable, quick to read a room and switch plans. The main vulnerability is distraction &mdash; heads up and phone down in unfamiliar blocks.",
    "Cancer": "Home-and-safety instincts are heightened. You feel the mood of a place almost immediately, for better or worse; unfamiliar places can feel emotionally unsettling even when nothing is actually wrong.",
    "Leo": "A confident, visible presence that can deter petty trouble &mdash; but also draws attention. Walk like you know where you're going, and keep valuables low-key.",
    "Virgo": "Detail-oriented and exit-aware. You tend to plan routes and notice hazards before they matter, which is a genuine safety asset in this placement.",
    "Libra": "Easy rapport with locals and strangers alike, but a pull toward smoothing things over. Speak up the moment something feels off instead of staying polite.",
    "Scorpio": "Sharp instincts for hidden risk and reading intentions. Comfortable being alone or private, with steady composure if something does go wrong.",
    "Sagittarius": "Adventurous and optimistic, drawn to the unfamiliar path. Great for exploring, but easy to underestimate risk &mdash; pair the wanderlust with basic precautions.",
    "Capricorn": "Cautious and structured. You plan ahead and respect local rules, which generally keeps decision-making low-risk in new places.",
    "Aquarius": "Independent and unconventional, happy to go off-script. Worth double-checking an area's reputation before improvising a route.",
    "Pisces": "Intuitive but easily absorbed in your own world, which can mean losing track of surroundings or being an easier target for a con. A little extra grounding helps here."
  };

  var PLANET_INFO = {
    sun: "visibility and confidence",
    moon: "emotional comfort and routine",
    mercury: "communication and quick thinking",
    venus: "ease, charm and social connection",
    mars: "energy, assertiveness and risk-taking",
    jupiter: "opportunity and expansiveness",
    saturn: "caution, structure and restriction",
    uranus: "unpredictability and sudden change",
    neptune: "confusion, illusion and vulnerability",
    pluto: "intensity, power dynamics and transformation"
  };

  var ASPECT_TONE = {
    Conjunction: "strongly colors",
    Sextile: "gently supports",
    Trine: "smoothly supports",
    Square: "creates friction with",
    Opposition: "pulls against"
  };

  // ---- initial state: try a silent geolocation, fall back if blocked ----
  useGeolocation(true);
  tryCompute();
})();
</script>
</body>
</html>
